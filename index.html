<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">

<title>Tamayo_DeJaVu</title>
<link rel="icon" type="image/png" href="logo.png">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Rajdhani:wght@400;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --crimson: #8B1A1A;
    --deep-red: #5C0A0A;
    --blood: #3D0000;
    --gold: #E8B86D;
    --amber: #D4920A;
    --cream: #F5E6C8;
    --muted: #C4A882;
    --card-bg: rgba(80, 15, 15, 0.55);
    --card-border: rgba(232, 184, 109, 0.18);
    --glow: rgba(232, 184, 109, 0.12);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    min-height: 100%;
    background: #1a0404;
    font-family: 'Rajdhani', sans-serif;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    overflow-x: hidden;
  }

  .bg {
    position: fixed;
    inset: 0;
    z-index: 0;
    overflow: hidden;
  }
  .bg::before {
    content: '';
    position: absolute;
    inset: -60%;
    background:
      radial-gradient(ellipse 80% 60% at 20% 30%, #7a1010 0%, transparent 60%),
      radial-gradient(ellipse 60% 80% at 80% 70%, #5c0a0a 0%, transparent 60%),
      radial-gradient(ellipse 100% 50% at 50% 50%, #2d0505 0%, transparent 70%);
    animation: bgShift 12s ease-in-out infinite alternate;
  }
  .bg::after {
    content: '';
    position: absolute;
    inset: 0;
    background: repeating-linear-gradient(
      -45deg,
      transparent,
      transparent 60px,
      rgba(255,255,255,0.012) 60px,
      rgba(255,255,255,0.012) 61px
    );
  }
  @keyframes bgShift {
    0%   { transform: translate(0,0) rotate(0deg); }
    50%  { transform: translate(-4%, 3%) rotate(4deg); }
    100% { transform: translate(4%, -3%) rotate(-4deg); }
  }

  .grain {
    position: fixed;
    inset: 0;
    z-index: 1;
    pointer-events: none;
    opacity: 0.06;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='1'/%3E%3C/svg%3E");
    background-size: 180px 180px;
  }

  .card {
    position: relative;
    z-index: 2;
    width: 100%;
    max-width: 420px;
    min-height: 100vh;
    padding: 36px 20px 48px;
    display: flex;
    flex-direction: column;
    align-items: center;
    animation: fadeIn 0.8s ease both;
  }
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(18px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .top-icon {
    position: absolute;
    top: 20px;
    left: 20px;
    width: 36px;
    height: 36px;
    border-radius: 50%;
    background: rgba(60,10,10,0.85);
    border: 1px solid var(--card-border);
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--gold);
    font-size: 18px;
    box-shadow: 0 0 12px var(--glow);
    animation: spin 20s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .avatar-wrap {
    margin-top: 8px;
    margin-bottom: 18px;
  }
  .avatar-ring {
    width: 90px;
    height: 90px;
    border-radius: 50%;
    padding: 3px;
    background: linear-gradient(135deg, var(--gold), var(--crimson), var(--amber));
    box-shadow: 0 0 28px rgba(232,184,109,0.35), 0 0 60px rgba(139,26,26,0.5);
    animation: pulse 3s ease-in-out infinite;
  }
  @keyframes pulse {
    0%,100% { box-shadow: 0 0 28px rgba(232,184,109,0.35), 0 0 60px rgba(139,26,26,0.5); }
    50%      { box-shadow: 0 0 40px rgba(232,184,109,0.6), 0 0 80px rgba(139,26,26,0.7); }
  }
  .avatar {
    width: 100%;
    height: 100%;
    border-radius: 50%;
    background: linear-gradient(135deg, #e8b86d 0%, #8B1A1A 50%, #3d0000 100%);
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Bebas Neue', sans-serif;
    font-size: 28px;
    color: var(--cream);
    letter-spacing: 2px;
  }

  .name {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 32px;
    letter-spacing: 3px;
    color: var(--gold);
    text-shadow: 0 0 20px rgba(232,184,109,0.5), 0 2px 8px rgba(0,0,0,0.8);
    margin-bottom: 4px;
    text-align: center;
  }
  .bio {
    font-size: 14px;
    color: var(--muted);
    letter-spacing: 1px;
    margin-bottom: 22px;
    text-align: center;
  }

  /* Social icons row */
  .socials {
    display: flex;
    gap: 14px;
    margin-bottom: 28px;
    flex-wrap: wrap;
    justify-content: center;
  }
  .social-btn {
    width: 42px;
    height: 42px;
    border-radius: 50%;
    background: var(--card-bg);
    border: 1px solid var(--card-border);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: all 0.25s ease;
    box-shadow: 0 2px 12px rgba(0,0,0,0.4);
    text-decoration: none;
    color: var(--gold);
  }
  .social-btn:hover {
    background: rgba(232,184,109,0.15);
    border-color: var(--gold);
    transform: translateY(-3px) scale(1.08);
    box-shadow: 0 6px 24px rgba(232,184,109,0.25);
    color: var(--cream);
  }
  .social-btn svg { width: 19px; height: 19px; fill: currentColor; }

  /* Links */
  .links {
    width: 100%;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .link-card {
    width: 100%;
    background: var(--card-bg);
    border: 1px solid var(--card-border);
    border-radius: 16px;
    overflow: hidden;
    cursor: pointer;
    transition: all 0.28s ease;
    text-decoration: none;
    position: relative;
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    animation: slideUp 0.6s ease both;
    box-shadow: 0 4px 20px rgba(0,0,0,0.35), inset 0 1px 0 rgba(255,255,255,0.06);
  }
  .link-card:nth-child(1) { animation-delay: 0.08s; }
  .link-card:nth-child(2) { animation-delay: 0.15s; }
  .link-card:nth-child(3) { animation-delay: 0.22s; }
  .link-card:nth-child(4) { animation-delay: 0.29s; }
  .link-card:nth-child(5) { animation-delay: 0.36s; }
  .link-card:nth-child(6) { animation-delay: 0.43s; }
  .link-card:nth-child(7) { animation-delay: 0.50s; }
  .link-card:nth-child(8) { animation-delay: 0.57s; }

  @keyframes slideUp {
    from { opacity: 0; transform: translateY(24px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .link-card::before {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(90deg, transparent, rgba(232,184,109,0.05), transparent);
    opacity: 0;
    transition: opacity 0.3s;
    pointer-events: none;
  }
  .link-card:hover::before { opacity: 1; }

  .link-card:hover {
    border-color: rgba(232,184,109,0.4);
    transform: translateX(4px) scale(1.01);
    box-shadow: 0 8px 32px rgba(0,0,0,0.5), 0 0 20px rgba(232,184,109,0.1), inset 0 1px 0 rgba(255,255,255,0.1);
  }

  .link-card.featured { border-radius: 18px; }

  .featured-img-placeholder {
    width: 100%;
    height: 155px;
    background: linear-gradient(135deg, #3d0505 0%, #8B2020 40%, #3d1010 100%);
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 16px 16px 0 0;
    font-family: 'Bebas Neue', sans-serif;
    font-size: 52px;
    color: rgba(232,184,109,0.28);
    letter-spacing: 8px;
    position: relative;
    overflow: hidden;
  }
  .featured-img-placeholder::after {
    content: '';
    position: absolute;
    inset: 0;
    background: repeating-linear-gradient(45deg, transparent, transparent 20px, rgba(255,255,255,0.018) 20px, rgba(255,255,255,0.018) 21px);
  }

  .link-row {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 14px 16px;
  }
  .link-thumb {
    width: 44px;
    height: 44px;
    border-radius: 12px;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    box-shadow: 0 2px 8px rgba(0,0,0,0.4);
  }
  .link-thumb svg { width: 22px; height: 22px; }

  .link-text { flex: 1; }
  .link-title {
    font-size: 16px;
    font-weight: 700;
    color: var(--gold);
    letter-spacing: 0.5px;
  }
  .link-sub {
    font-size: 12px;
    color: var(--muted);
    margin-top: 1px;
  }

  .link-more {
    width: 24px;
    height: 24px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 3px;
    opacity: 0.4;
    flex-shrink: 0;
  }
  .link-more span {
    width: 4px;
    height: 4px;
    border-radius: 50%;
    background: var(--gold);
    display: block;
  }

  .footer {
    margin-top: 36px;
    font-family: 'Space Mono', monospace;
    font-size: 10px;
    color: rgba(196,168,130,0.3);
    letter-spacing: 2px;
    text-align: center;
  }
  .footer span { color: rgba(232,184,109,0.45); }
</style>
